name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mytime
          POSTGRES_PASSWORD: mytime_ci
          POSTGRES_DB: mytime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mytime"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mytime:mytime_ci@localhost:5432/mytime?schema=public
      DIRECT_URL: postgresql://mytime:mytime_ci@localhost:5432/mytime?schema=public
      TEST_DATABASE_URL: postgresql://mytime:mytime_ci@localhost:5432/mytime?schema=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
